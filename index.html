<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Furnora</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./assets/css/output.css" />
  </head>

  <body>
    <header class="border-b border-border bg-background">
      <div
        class="flex h-[45px] items-center justify-center bg-secondary px-3 text-center"
      >
        <p class="text-sm font-normal tracking-wide text-white">
          Free delivery on selected furniture orders
        </p>
      </div>

      <div
        class="mx-auto flex h-[81px] w-full max-w-7xl items-center justify-between px-6"
      >
        <a
          href="./index.html"
          class="font-heading text-[30px] font-bold text-primary"
        >
          FURNORA
        </a>

        <nav class="hidden lg:block">
          <ul class="flex items-center gap-6">
            <li>
              <a
                href="./index.html"
                class="relative inline-flex h-[81px] items-center font-medium text-secondary after:absolute after:bottom-[20px] after:left-0 after:h-[2px] after:w-full after:bg-secondary"
                aria-current="page"
              >
                Home
              </a>
            </li>

            <li>
              <a
                href="./products.html"
                class="inline-flex h-[81px] items-center text-text-secondary transition-colors hover:text-secondary"
              >
                Products
              </a>
            </li>

            <li>
              <a
                href="./about.html"
                class="inline-flex h-[81px] items-center text-text-secondary transition-colors hover:text-secondary"
              >
                About
              </a>
            </li>
          </ul>
        </nav>

        <div class="hidden items-center gap-3 lg:flex">
          <a href="./wishlist.html" class="transition-opacity hover:opacity-50">
            <img src="./assets/icons/heart.svg" alt="Wishlist" class="size-6" />
          </a>

          <a href="./profile.html" class="transition-opacity hover:opacity-50">
            <img
              src="./assets/icons/user-account.svg"
              alt="Profile"
              class="size-6"
            />
          </a>

          <a
            href="./cart.html"
            class="relative transition-opacity hover:opacity-50"
          >
            <img
              src="./assets/icons/shopping-cart.svg"
              alt="Shopping cart"
              class="size-6"
            />
          </a>
        </div>

        <div class="flex items-center gap-4 lg:hidden">
          <a href="./cart.html" class="relative">
            <img
              src="./assets/icons/shopping-cart.svg"
              alt="Shopping cart"
              class="size-6"
            />
          </a>

          <button
            type="button"
            class="flex size-10 items-center justify-center"
          >
            <img
              src="./assets/icons/Menu--Streamline-Sharp-Streamline-Material.png"
              alt="Menu"
              class="size-6"
            />
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
